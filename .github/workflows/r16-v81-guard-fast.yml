              print('R16_REAL_PATCH=' + json.dumps(result, sort_keys=True))
              py = Path(root) / 'fixture.py'
              py.write_text('value = 1' + chr(10), encoding='utf-8')
              python_result = apply_patch(root, 'fixture.py',
                                          expected_sha256=sha256(py.read_bytes()),
                                          old='value = 1', new='value = 2')
              assert py.read_text() == 'value = 2' + chr(10)
