name: R16 v8.1 isolated guard fast CI

# Non-scheduled, isolated-branch-only regression; never a ChatGPT native run.
on:
  push:
    branches:
      - ai/r16-v81-fast-full-ci-20261024
    paths:
      - .github/workflows/r16-v81-guard-fast.yml
      - experiments/r16-bot-runtime/v81_live_schedule_collector.py
      - experiments/r16-bot-runtime/test_v81_live_schedule_collector.py
      - experiments/r16-bot-runtime/v81_unified_schedule_provenance.py
      - experiments/r16-bot-runtime/test_v81_unified_schedule_provenance.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r16-v81-isolated-guard-fast
  cancel-in-progress: false

jobs:
  fast-audit:
    if: github.ref == 'refs/heads/ai/r16-v81-fast-full-ci-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: experiments/r16-bot-runtime
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: FAST 20 synthetic role checks with serial oracle
        run: python3 v81_swarm.py --mode audit --workers 4
      - name: Guard regression (changed modules only)
        run: |
          python3 -m unittest -q test_v81_live_schedule_collector test_v81_unified_schedule_provenance

  full-regression:
    needs: fast-audit
    if: github.ref == 'refs/heads/ai/r16-v81-fast-full-ci-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: experiments/r16-bot-runtime
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Full 100 synthetic roles after FAST passes
        run: python3 v81_swarm.py --mode all --workers 4
      - name: Report original ZIP fingerprint gaps without exposing private files
        run: python3 v81_source_parity.py
      - name: Scope guard
        run: |
          echo 'ISOLATED_OFFLINE_FAST_AND_FULL_ONLY=PASS'
          echo 'NATIVE_CHATGPT_RUN=UNVERIFIED'
