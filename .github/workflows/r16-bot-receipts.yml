name: R16 BOT local receipt verification (isolated branch)

on:
  push:
    branches:
      - ai/r16-evidence-reconciler-2026-10-22
    paths:
      - .github/workflows/r16-bot-receipts.yml
      - experiments/r16-bot-runtime/**

permissions:
  contents: read

jobs:
  receipt-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: experiments/r16-bot-runtime
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up OpenJDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Measure Python Java and JavaScript tests
        run: python measure_runtime.py
      - name: Verify local receipt and source changes fail closed
        run: python -m unittest -v test_v5_receipt test_receipt_source_binding test_java_fixture_coverage test_javascript_fixture_coverage test_wrapper_integrity test_supervisor test_bot_coordinator test_background_coordinator
      - name: Install and verify all 100 offline role rules
        run: |
          python install_local.py
          python batch_validate_100.py
      - name: Verify installed receipt consumer
        run: python .local_install/bin/ai-bot-M01
      - name: Smoke-test offline supervisor and coordinator (not a scheduled run)
        run: |
          python supervisor.py --once --state-dir .ci_supervisor_state
          python bot_coordinator.py --goal audit --state-dir .ci_supervisor_state
          python -c 'import json; from pathlib import Path; d=json.loads(Path(".ci_supervisor_state/latest.json").read_text()); assert d["status"] == "PASS"; assert d["kind"] == "OFFLINE_LOCAL_CHECK_NOT_SCHEDULED_APP_PROOF"'
      - name: Smoke-test offline background loop once (no daemon deployed)
        run: |
          python background_coordinator.py --goal audit --state-dir .ci_background_state
          python -c 'import json; from pathlib import Path; d=json.loads(Path(".ci_background_state/background_latest.json").read_text()); assert d["status"] == "PASS"; assert d["cycle"] == 1; assert d["kind"] == "OFFLINE_BACKGROUND_LOOP_NOT_NATIVE_RESERVATION"; assert d["official_unattended_app_call_success"] == "UNVERIFIED"'
