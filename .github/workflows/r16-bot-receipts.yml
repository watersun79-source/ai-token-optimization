name: R16 BOT local receipt verification (isolated branch)

on:
  push:
    branches:
      - ai/r16-evidence-reconciler-2026-10-22
    paths:
      - .github/workflows/r16-bot-receipts.yml
      - experiments/r16-bot-runtime/**

permissions:
  contents: read

jobs:
  receipt-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: experiments/r16-bot-runtime
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up OpenJDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Measure Python Java and JavaScript tests
        run: python measure_runtime.py
      - name: Verify local receipt and source changes fail closed
        run: python -m unittest -v test_v5_receipt test_receipt_source_binding test_java_fixture_coverage test_javascript_fixture_coverage
      - name: Install and verify all 100 offline role rules
        run: |
          python install_local.py
          python batch_validate_100.py
      - name: Verify installed receipt consumer
        run: python .local_install/bin/ai-bot-M01
