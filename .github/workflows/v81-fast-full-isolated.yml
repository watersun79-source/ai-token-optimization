name: AI R16 v8.1 isolated fast vs full benchmarking

# Separate read-only experiment: does NOT alter hourly :15 cron or ChatGPT :00 task.
on:
  push:
    branches:
      - ai/r16-v81-fast-full-ci-20261024
      - ai/v81-cloud-evidence-artifact-20261025
    paths:
      - experiments/r16-bot-runtime/v81_split_bench.py
      - experiments/r16-bot-runtime/v81_swarm.py
      - experiments/r16-bot-runtime/v81_unified_evidence.py
      - experiments/r16-bot-runtime/test_v81_unified_evidence.py
      - experiments/r16-bot-runtime/utc_strict_oracle.c
      - experiments/r16-bot-runtime/test_c_utc_oracle.py
      - experiments/r16-bot-runtime/test_v81_swarm.py
      - experiments/r16-bot-runtime/v81_schedule_provenance.py
      - experiments/r16-bot-runtime/v81_unified_schedule_provenance.py
      - experiments/r16-bot-runtime/v81_live_schedule_collector.py
      - experiments/r16-bot-runtime/test_v81_live_schedule_collector.py
      - experiments/r16-bot-runtime/test_v81_unified_schedule_provenance.py
      - experiments/r16-bot-runtime/test_v81_schedule_provenance.py
      - experiments/r16-bot-runtime/runner.py
      - experiments/r16-evidence-reconciler/audit_v2.py
      - experiments/r16-evidence-reconciler/tests/test_audit_v2.py
      - experiments/r16-bot-runtime/catalog.json
      - experiments/r16-bot-runtime/test_runtime.py
      - experiments/r16-bot-runtime/v81_verifiable_18.py
      - experiments/r16-bot-runtime/test_v81_verifiable_18.py
      - experiments/r16-bot-runtime/v81_activepieces_checkpoint_audit.py
      - experiments/r16-bot-runtime/test_v81_activepieces_checkpoint_audit.py
      - docs/ai/V81_VERIFIABLE_18_20261025.md
      - experiments/r16-bot-runtime/test_v81_split_bench.py
      - experiments/r16-bot-runtime/v81_source_parity.py
      - experiments/r16-bot-runtime/test_v81_source_parity.py
      - experiments/r16-bot-runtime/test_v81_behavior_oracle.py
      - experiments/r16-bot-runtime/v81_output_contract.py
      - experiments/r16-bot-runtime/test_v81_output_contract.py
      - experiments/r16-bot-runtime/test_v81_output_contract_fast.py
      - experiments/r16-bot-runtime/v81_speed_orchestrator.py
      - experiments/r16-bot-runtime/test_v81_speed_orchestrator.py
      - experiments/r16-bot-runtime/v81_adaptive_parallel.py
      - experiments/r16-bot-runtime/test_v81_adaptive_parallel.py
      - experiments/r16-bot-runtime/v81_parallel_scale_experiment.py
      - experiments/r16-bot-runtime/test_v81_parallel_scale_experiment.py
      - experiments/r16-bot-runtime/v81_fast64.py
      - experiments/r16-bot-runtime/test_v81_fast64.py
      - experiments/r16-bot-runtime/v81_fast128.py
      - experiments/r16-bot-runtime/test_v81_fast128.py
      - experiments/r16-bot-runtime/v81_fast256.py
      - experiments/r16-bot-runtime/test_v81_fast256.py
      - experiments/r16-bot-runtime/v81_fast_auto.py
      - experiments/r16-bot-runtime/test_v81_fast_auto.py
      - docs/ai/V81_FAST_AUTO_20261024.md
      - docs/ai/V81_FAST256_20261024.md
      - docs/ai/V81_FAST128_20261024.md
      - docs/ai/V81_FAST64_20261024.md
      - docs/ai/V81_PARALLEL_SCALING_20261024.md
      - docs/ai/V81_ADAPTIVE_PARALLEL_20261024.md
      - experiments/r16-bot-runtime/v81_ci_gate.py
      - experiments/r16-bot-runtime/test_v81_ci_gate.py
      - docs/ai/V81_FAST_POLICY_20261024.md
      - docs/ai/V81_SOURCE_PARITY_20261024.md
      - docs/ai/V81_FAST_FULL_BENCHMARK_20261024.md
      - .github/workflows/v81-fast-full-isolated.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-r16-v81-fast-full-isolated
  cancel-in-progress: false

jobs:
  fast-audit:
    name: Fast audit - 20 selected BOT rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        working-directory: experiments/r16-bot-runtime
    steps:
      - name: Checkout isolated commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify optional offline 18-role substitutions (not native attestation)
        run: python3 -m unittest -q test_v81_verifiable_18
      - name: Coordinate and independently verify local FAST swarm
        run: |
          python3 -m unittest -q test_v81_swarm
          python3 v81_swarm.py --mode audit --workers 4
      - name: Verify official-style schedule provenance fail-closed cases (offline fixtures)
        run: python3 -m unittest -q test_v81_schedule_provenance
      - name: Independently exercise unified schedule provenance fail-closed fixture cases
        run: python3 -m unittest -q test_v81_unified_schedule_provenance
      - name: Verify live schedule collector with mocked API negative cases
        run: python3 -m unittest -q test_v81_live_schedule_collector
      - name: Read official GitHub schedule API and correlate unified evidence (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 v81_live_schedule_collector.py \
            --repository "$GITHUB_REPOSITORY" \
            --expected-workflow-sha "923c281f82023cc6b49f3844bad17f508f1ab203" \
            --expected-source-sha "a88c7993c27404da43cba84a8f69e01a917315a6" \
            --output-json "$RUNNER_TEMP/v81_schedule_receipt.json"
      - name: Upload sanitized cloud schedule evidence (7-day isolated artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v81-schedule-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/v81_schedule_receipt.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify self-reported Activepieces checkpoint chronology
        run: python3 -m unittest -q test_v81_activepieces_checkpoint_audit
      - name: Verify scheduled run evidence reconciler rejects non-ASCII Slack timestamps
        run: cd ../r16-evidence-reconciler && python3 -m unittest discover -s tests -p test_audit_v2.py -q
      - name: Verify source SHA comparison (not verbatim v8.1)
        run: |
          python3 v81_source_parity.py
          python3 -m unittest -q test_v81_source_parity
      - name: Verify 18 replacement checks incl. negative test cases
        run: python3 -m unittest -q test_v81_behavior_oracle test_v81_output_contract_fast
      - name: Check SHA caching, dedup, parallel reads and condensed reporting
        run: |
          python3 -m unittest -q test_v81_speed_orchestrator
          python3 v81_speed_orchestrator.py --repeats 35
      - name: Execute adaptive fast-first audit and fail-closed gate tests
        run: |
          python3 -m unittest -q test_v81_ci_gate
          python3 v81_speed_orchestrator.py --ci-fast
      - name: Verify staged 4-8-16 adaptive parallel reads and auto-backoff
        run: |
          python3 -m unittest -q test_v81_adaptive_parallel
          python3 v81_adaptive_parallel.py
      - name: Profile offline 4-8-16-32-64-128 parallel scaling
        run: |
          python3 -m unittest -q test_v81_parallel_scale_experiment
          python3 v81_parallel_scale_experiment.py
      - name: Verify FAST64 local opt-in and adaptive backoff
        run: |
          python3 -m unittest -q test_v81_fast64
          python3 v81_fast64.py
      - name: Verify local FAST128 opt-in and compare 64 vs 128
        run: |
          python3 -m unittest -q test_v81_fast128
          python3 v81_fast128.py
      - name: Test opt-in FAST256 and profile 64 vs 128 vs 256 locally
        run: |
          python3 -m unittest -q test_v81_fast256
          python3 v81_fast256.py
      - name: Verify evidence-gated FAST auto local ceiling
        run: python3 -m unittest -q test_v81_fast_auto
      - name: Measure fast 20-rule audit on hosted runner
        run: python3 v81_split_bench.py --mode audit --repeats 150

  full-regression:
    name: Full regression - 100 rules + cross-language tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        working-directory: experiments/r16-bot-runtime
    steps:
      - name: Checkout isolated commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Fail-closed path gate (skip full only on exact docs-only push)
        id: change_gate
        env:
          V81_PUSH_BEFORE: ${{ github.event.before }}
        run: python3 v81_ci_gate.py
      - name: Verify Activepieces checkpoint chronology (not native attestation)
        if: steps.change_gate.outputs.run_full == 'true'
        run: python3 -m unittest -q test_v81_activepieces_checkpoint_audit
      - name: Verify scheduled run evidence reconciler (offline-only, not native attestation)
        if: steps.change_gate.outputs.run_full == 'true'
        run: cd ../r16-evidence-reconciler && python3 -m unittest discover -s tests -p test_audit_v2.py -q
      - name: Verify original-archive source parity before tests rewrite evidence
        if: steps.change_gate.outputs.run_full == 'true'
        run: |
          python3 v81_source_parity.py
          python3 -m unittest -q test_v81_source_parity
      - name: Measure pinned local Python Java JavaScript regressions
        if: steps.change_gate.outputs.run_full == 'true'
        run: python3 measure_runtime.py
      - name: Compile C11 strict timestamp oracle and test cross-language UTC parity
        if: steps.change_gate.outputs.run_full == 'true'
        run: |
          python3 -m unittest -q test_c_utc_oracle
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -o "$RUNNER_TEMP/v81_utc_c" utc_strict_oracle.c
          "$RUNNER_TEMP/v81_utc_c" utc_strict_oracle_cases.tsv
      - name: Independently verify 100-role offline swarm
        if: steps.change_gate.outputs.run_full == 'true'
        run: python3 v81_swarm.py --mode all --workers 4
      - name: Build SHA-bound unified Python Java JavaScript C11 and swarm evidence
        if: steps.change_gate.outputs.run_full == 'true'
        run: |
          python3 -m unittest -q test_v81_unified_evidence
          python3 v81_unified_evidence.py --output "$RUNNER_TEMP/v81_unified_evidence.json"
      - name: Verify base tests and 18 replacement negative tests
        if: steps.change_gate.outputs.run_full == 'true'
        run: python3 -m unittest -q test_runtime test_v81_split_bench test_v81_behavior_oracle test_v81_output_contract
      - name: Compare all 100 role output records with private original SHA digests
        if: steps.change_gate.outputs.run_full == 'true'
        run: python3 v81_output_contract.py
      - name: Measure all 100 BOT rules on hosted runner
        if: steps.change_gate.outputs.run_full == 'true'
        run: python3 v81_split_bench.py --mode all --repeats 150
