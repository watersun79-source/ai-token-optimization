name: PR31 replay provenance separation (new cases only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "experiments/oss-top10-safe-adoption/chat_github_connector_adapter.mjs"
      - "tests/pr31_replay_provenance.test.mjs"
      - ".github/workflows/pr31-replay-provenance.yml"

permissions:
  contents: read

jobs:
  replay-counters-fail-closed:
    if: >-
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.ref == 'ai/site-github403-failclosed-20261116' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: New replay provenance cases only
        run: node --test tests/pr31_replay_provenance.test.mjs
