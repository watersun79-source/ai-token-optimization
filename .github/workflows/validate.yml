name: Validate AI optimization policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: validation only needs to read repository contents.
permissions:
  contents: read

# Avoid wasting Actions minutes on duplicate validation for the same ref.
concurrency:
  group: policy-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Compare JavaScript validator against shared fixtures
        run: node tools/json_output_validator.js
      - name: Validate provider-free review metadata guard
        run: node --test tools/free-web-guard/guard.test.mjs
      - name: Verify AI BOT v8.2 adaptive evidence decisions (offline)
        run: node --test tools/adaptive_audit_v82.test.mjs
      - name: Verify AI BOT v8.3 event-driven parallel executor (offline)
        run: node --test tools/adaptive_parallel_v83.test.mjs
      # Isolated v8.3.8 only: no network/secrets; two rounds of synthetic SQLite jobs.
      - name: Benchmark bounded adaptive standalone processes (isolated only)
        if: github.event_name == 'pull_request' && github.head_ref == 'ai/v838-adaptive-parallel-performance-20261030'
        run: python -m tools.benchmark_standalone_v838 --jobs 48 --repeats 2
      # v8.3.9 isolated: finite 10-second repeated real subprocess stress, no remote calls.
      - name: Soak adaptive standalone worker with local SQLite (isolated only)
        if: github.event_name == 'pull_request' && github.head_ref == 'ai/v839-workload-aware-soak-20261030'
        run: python -m tools.soak_standalone_v839 --seconds 10 --jobs 12
      # New isolated 256-slot test: one Python process, 256 overlapping synthetic async waits.
      - name: Verify 256 in-flight synthetic async coroutines and SQLite persistence (isolated only)
        if: github.event_name == 'pull_request' && github.head_ref == 'ai/v840-256-async-concurrency-20261031'
        run: python -m tools.probe_256_async_v840
      # v8.4.1: one-shot local SDK preflight and fake-token tests only; no network/models/credentials.
      - name: Verify Neon AI Gateway offline billing guard (isolated only)
        if: github.event_name == 'pull_request' && github.head_ref == 'ai/v841-neon-gateway-offline-guard-20261031'
        run: |
          node --test tools/neon_gateway_preflight_v841.test.mjs
          node tools/neon_gateway_preflight_v841.mjs --self-test
          node --check examples/neon_gateway_manual_one_call_v841.mjs
      # v8.4.2 isolated: local HTTP/SSE only; no provider keys, bills or external API calls.
      - name: Verify realtime SSE dashboard and protected read-only status (isolated only)
        if: github.event_name == 'pull_request' && github.head_ref == 'ai/v842-live-readonly-20261031'
        run: |
          node --test tools/realtime_dashboard_v842.test.mjs
          node --test tools/render_blueprint_v842.test.mjs
          node --check tools/realtime_dashboard_v842.mjs
      # One-shot hosted read-only smoke probe. No secrets, no app writes, no server creation.
      # This fires on exactly the commit that introduces the step; later commits skip the network.
      - name: Probe v8.4.2 public HTTPS 200 and anonymous 401 (one shot)
        if: github.event_name == 'pull_request' && github.head_ref == 'ai/v842-live-readonly-20261031'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          git fetch --quiet --no-tags --depth=1 origin refs/heads/ai/v842-live-readonly-20261031
          if [ "$(git log -1 --pretty=%s FETCH_HEAD)" != 'test(v842): one-shot public HTTPS and anonymous auth readback' ]; then
            echo 'V842_ONE_SHOT_PROBE=SKIPPED_NOT_TARGET_COMMIT'
            exit 0
          fi
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          target = 'https://ai-bot-v842-live-readonly-20261031-1vz0.onrender.com'
          def read(path):
              req = urllib.request.Request(target + path, headers={'User-Agent': 'V842-CI-ReadOnly-Check', 'Cache-Control': 'no-store'})
              try:
                  with urllib.request.urlopen(req, timeout=55) as resp:
                      return resp.status, resp.read(2048), None
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(2048), None
              except Exception as exc:
                  return None, b'', type(exc).__name__
          health_code, body, health_error = read('/healthz')
          auth_code, _, auth_error = read('/api/snapshot')
          try:
              health_ok = health_code == 200 and json.loads(body).get('status') == 'ok'
          except (ValueError, AttributeError, UnicodeDecodeError):
              health_ok = False
          auth_ok = auth_code == 401
          print('V842_HTTPS_HEALTH_STATUS=' + str(health_code))
          print('V842_HTTPS_HEALTH_VERDICT=' + ('PASS' if health_ok else 'UNVERIFIED'))
          print('V842_HTTPS_ANON_STATUS=' + str(auth_code))
          print('V842_HTTPS_ANON_VERDICT=' + ('PASS' if auth_ok else 'UNVERIFIED'))
          if health_error or auth_error:
              print('V842_NETWORK_ERROR_TYPES=' + ','.join(str(e) for e in (health_error,auth_error) if e))
          print('V842_COMBINED_VERDICT=' + ('PASS' if health_ok and auth_ok else 'UNVERIFIED'))
          raise SystemExit(0 if health_ok and auth_ok else 1)
          PY
      # One bounded remote GET for login page and anonymous SSE denial. No credentials.
      # Only this PR head's one-shot commit runs the network probe; no future hourly polling.
      - name: Probe v8.4.2 anonymous SSE boundary (one shot)
        if: github.event_name == 'pull_request' && github.head_ref == 'ai/v842-live-readonly-20261031'
        timeout-minutes: 3
        run: |
          git fetch --quiet --no-tags --depth=1 origin refs/heads/ai/v842-live-readonly-20261031
          if [ "$(git log -1 --pretty=%s FETCH_HEAD)" != 'test(v842): one-shot deployed SSE anonymous boundary' ]; then
            echo 'V842_SSE_BOUNDARY=SKIPPED_NOT_TARGET_COMMIT'
            exit 0
          fi
          python - <<'PY'
          import urllib.error, urllib.request
          root = 'https://ai-bot-v842-live-readonly-20261031-1vz0.onrender.com'
          def get(path):
              req=urllib.request.Request(root+path,headers={'User-Agent':'V842-CI-Anon-Boundary','Cache-Control':'no-store'})
              try:
                  with urllib.request.urlopen(req, timeout=40) as resp:
                      return resp.status,resp.read(4096)
              except urllib.error.HTTPError as exc:
                  return exc.code,exc.read(4096)
          login_status, html = get('/')
          events_status, events_body = get('/events')
          login_ok = login_status==200 and b'<form action="/login"' in html and b'name="key"' in html
          events_ok = events_status==401 and b'AUTH_REQUIRED' in events_body
          print('V842_LOGIN_PAGE_HTTP='+str(login_status))
          print('V842_LOGIN_PAGE_VERDICT='+('PASS' if login_ok else 'UNVERIFIED'))
          print('V842_ANON_EVENTS_HTTP='+str(events_status))
          print('V842_ANON_EVENTS_VERDICT='+('PASS' if events_ok else 'UNVERIFIED'))
          print('V842_SSE_BOUNDARY_VERDICT='+('PASS' if login_ok and events_ok else 'UNVERIFIED'))
          raise SystemExit(0 if login_ok and events_ok else 1)
          PY
      # One bounded public HTTPS read on this isolated draft PR ONLY.
      - name: Verify v8.3.2 Render public HTTPS health contract (one shot)
        if: github.event_name == 'pull_request' && github.head_ref == 'ai/v831-durable-recovery-20261030'
        run: python -m tools.verify_render_https_v832
      # New isolated Render Free service: one independent public GET + unauthorized POST, PR-only.
      - name: Verify v8.3.4 Render gateway HTTPS and fail-closed authentication (one shot)
        if: github.event_name == 'pull_request' && github.head_ref == 'ai/v834-authenticated-queue-20261030'
        run: python -m tools.verify_v834_deployed_gateway
      # One public GET plus one unauthenticated POST; no credentials or job execution.
      - name: Verify v8.3.5 Render gateway public HTTPS and unauthorized 401 (one shot)
        if: github.event_name == 'pull_request' && github.head_ref == 'ai/v835-neon-atomic-queue-20261030'
        run: python -m tools.verify_v835_public_security
