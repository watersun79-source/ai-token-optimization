name: Validate AI optimization policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: validation only needs to read repository contents.
permissions:
  contents: read

# Avoid wasting Actions minutes on duplicate validation for the same ref.
concurrency:
  group: policy-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Compare JavaScript validator against shared fixtures
        run: node tools/json_output_validator.js
      - name: Validate provider-free review metadata guard
        run: node --test tools/free-web-guard/guard.test.mjs
      - name: Verify Activepieces chat webhook callFlow reference fails closed (isolated)
        if: github.event_name == 'pull_request' && github.head_ref == 'ai/v843-activepieces-subflow-guard-20261031'
        run: |
          node --test tools/ap_callflow_guard_v843.test.mjs
          node --check tools/ap_callflow_guard_v843.mjs
