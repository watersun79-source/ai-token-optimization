name: Validate AI optimization policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: validation only needs to read repository contents.
permissions:
  contents: read

# Avoid wasting Actions minutes on duplicate validation for the same ref.
concurrency:
  group: policy-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Compare JavaScript validator against shared fixtures
        run: node tools/json_output_validator.js
      - name: Validate provider-free review metadata guard
        run: node --test tools/free-web-guard/guard.test.mjs
      # Isolated v8.4.4: local loopback-only TCP I/O overlap, no external provider calls.
      - name: Verify 256 localhost TCP async requests and responses (isolated only)
        if: github.event_name == 'pull_request' && github.head_ref == 'ai/v844-localhost-io-20261101'
        run: python -m tools.loopback_io_v844 --clients 256
