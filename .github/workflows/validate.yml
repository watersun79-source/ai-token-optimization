name: Validate AI optimization policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: validation only needs to read repository contents.
permissions:
  contents: read

# Avoid wasting Actions minutes on duplicate validation for the same ref.
concurrency:
  group: policy-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Compare JavaScript validator against shared fixtures
        run: node tools/json_output_validator.js
