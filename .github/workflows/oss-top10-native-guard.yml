name: OSS TOP10 native evidence isolated regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: oss-top10-native-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-run-cooldown-isolated:
    name: Native KST and cooldown fail-closed (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Run native integrity and cooldown isolated tests
        run: |
          python -B - <<'PYTEST'
          import unittest
          from pathlib import Path
          test_file = Path("tests/test_native_run_cooldown_guard.py")
          if not test_file.is_file() or test_file.is_symlink():
              raise SystemExit("NATIVE_GUARD_TEST_FILE_MISSING_OR_SYMLINK")
          suite = unittest.defaultTestLoader.discover("tests", pattern=test_file.name)
          if suite.countTestCases() < 27:
              raise SystemExit("NATIVE_GUARD_TESTS_MISSING_OR_TRUNCATED")
          if not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful():
              raise SystemExit(1)
          PYTEST
