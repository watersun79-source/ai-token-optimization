name: PR31 GitHub long cooldown (new isolated cases)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "experiments/oss-top10-safe-adoption/site_github_connected_read_gate.mjs"
      - "tests/pr31_long_cooldown_edge.test.mjs"
      - ".github/workflows/pr31-long-cooldown-edge.yml"

permissions:
  contents: read

jobs:
  new-long-cooldown-only:
    if: >-
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.ref == 'ai/site-github403-failclosed-20261116' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: New HTTP 403/429 cooldown edge cases only
        run: node --test tests/pr31_long_cooldown_edge.test.mjs
