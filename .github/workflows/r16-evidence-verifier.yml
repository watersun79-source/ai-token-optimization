name: R16 offline evidence verifier (isolated branch)

on:
  push:
    branches:
      - ai/r16-evidence-reconciler-2026-10-22
    paths:
      - .github/workflows/r16-evidence-verifier.yml
      - experiments/r16-evidence-reconciler/audit_v2.py
      - experiments/r16-evidence-reconciler/activepieces_mock_guard_2026-10-23.js
      - experiments/r16-evidence-reconciler/tests/**
      - experiments/r16-evidence-reconciler/polyglot/**
      - experiments/r16-evidence-reconciler/fixtures/**
  workflow_dispatch:

# Zero AI/provider calls. GitHub's public-repo standard runner only.
# NEVER authenticates native ChatGPT unattended execution.
permissions:
  contents: read

concurrency:
  group: r16-offline-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  polyglot-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: experiments/r16-evidence-reconciler
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Node 24 (no npm dependencies)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up OpenJDK 21 (no Maven dependencies)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Run original Python regressions
        run: python -m unittest discover -s tests -v
      - name: Run shared Python time fixtures
        run: python -m unittest discover -s polyglot -p 'test_*.py' -v
      - name: Run actual JavaScript mock guard against shared fixtures
        run: node --test polyglot/test_activepieces_guard.mjs
      - name: Run existing 15-case JavaScript cross-check
        run: node polyglot/check_js.mjs fixtures/time_cases.tsv
      - name: Run independent Java nanosecond time oracle
        run: |
          mkdir -p "$RUNNER_TEMP/r16-java"
          javac -d "$RUNNER_TEMP/r16-java" polyglot/R16TimeOracle.java polyglot/R16TimeOrderCheck.java
          java -cp "$RUNNER_TEMP/r16-java" R16TimeOracle polyglot/time_vectors.tsv
          java -cp "$RUNNER_TEMP/r16-java" R16TimeOrderCheck fixtures/time_cases.tsv
