name: R16 offline evidence verifier (isolated branch)

on:
  push:
    branches:
      - ai/r16-evidence-reconciler-2026-10-22
    paths:
      - .github/workflows/r16-evidence-verifier.yml
      - experiments/r16-evidence-reconciler/audit_v2.py
      - experiments/r16-evidence-reconciler/tests/**
      - experiments/r16-evidence-reconciler/activepieces_mock_guard_2026-10-23.js
      - experiments/r16-evidence-reconciler/fixtures/**
      - experiments/r16-evidence-reconciler/polyglot/**
  workflow_dispatch:

# Do not change main, ChatGPT automation, Activepieces or external apps.
# Public repository + standard GitHub runner; no provider API or secrets.
permissions:
  contents: read

concurrency:
  group: r16-offline-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: experiments/r16-evidence-reconciler
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up standard-library Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run complete R16 offline regression
        run: python -m unittest discover -s tests -v
      - name: Verify original Activepieces JavaScript with shared offline fixtures
        run: node --experimental-default-type=module polyglot/check_js.mjs fixtures/time_cases.tsv
      - name: Compile and run independent Java timestamp oracle
        run: |
          mkdir -p /tmp/r16-polyglot-java
          javac -encoding UTF-8 -d /tmp/r16-polyglot-java polyglot/R16TimeOrderCheck.java polyglot/R16TimeOracle.java
          java -cp /tmp/r16-polyglot-java R16TimeOrderCheck fixtures/time_cases.tsv
          java -cp /tmp/r16-polyglot-java R16TimeOracle polyglot/time_vectors.tsv
