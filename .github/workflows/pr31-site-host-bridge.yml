name: PR31 isolated Site host bridge (new cases only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "experiments/oss-top10-safe-adoption/site_host_collector_bridge.mjs"
      - "tests/pr31_site_host_collector_bridge.test.mjs"
      - ".github/workflows/pr31-site-host-bridge.yml"

permissions:
  contents: read

jobs:
  host-boundary-only:
    if: >-
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.ref == 'ai/site-github403-failclosed-20261116' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run new Site host integration seam negative tests
        run: node --test tests/pr31_site_host_collector_bridge.test.mjs
