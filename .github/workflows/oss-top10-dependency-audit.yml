name: OSS TOP10 locked dependency security audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/oss-top10-dependency-audit.yml"
      - ".github/security/**"
      - "experiments/oss-top10-safe-adoption/**"

permissions:
  contents: read

concurrency:
  group: oss-top10-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-inventory:
    name: Verify dependency inventory and quarantines
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify shipped lock hashes and reject removed locks
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(python3 experiments/oss-top10-safe-adoption/activation_guard.py --audit-matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'Audited lock inventory: `%s`\n' "$matrix" >> "$GITHUB_STEP_SUMMARY"
          printf 'Quarantined SDKs: Activepieces, CrewAI, Letta, OpenHands. Their lock files were removed. Historical findings: GitHub Actions run 43648956618.\n' >> "$GITHUB_STEP_SUMMARY"

  python-security:
    name: "PyPI advisory + dependency licenses ${{ matrix.id }}"
    needs: dependency-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.dependency-inventory.outputs.matrix) }}
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      MEM0_API_KEY: ""
      OTEL_SDK_DISABLED: "true"
      PIP_NO_INPUT: "1"
      PIP_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install official public PyPA audit client
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --disable-pip-version-check --no-input "pip-audit==2.10.1"
      - name: Verify official Python advisories before installing SDK dependencies
        shell: bash
        run: |
          set -euo pipefail
          LOCK="experiments/oss-top10-safe-adoption/locks/${{ matrix.id }}-pip.txt"
          code=0
          python -m pip_audit --no-deps --disable-pip -r "$LOCK" --format json --progress-spinner off > "$RUNNER_TEMP/vuln.json" || code=$?
          python .github/security/oss_top10_audit.py --lock "$LOCK" \
            --audit "$RUNNER_TEMP/vuln.json" --exit-code "$code" --advisory-only
      - name: Install immutable version set in disposable venv for package license metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/license-env"
          "$RUNNER_TEMP/license-env/bin/python" -m pip install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --no-input --disable-pip-version-check --no-cache-dir -r "experiments/oss-top10-safe-adoption/locks/${{ matrix.id }}-pip.txt"
          "$RUNNER_TEMP/license-env/bin/python" -m pip check
      - name: Independently verify advisory coverage and licenses
        shell: bash
        run: |
          "$RUNNER_TEMP/license-env/bin/python" .github/security/oss_top10_audit.py \
            --lock "experiments/oss-top10-safe-adoption/locks/${{ matrix.id }}-pip.txt" \
            --audit "$RUNNER_TEMP/vuln.json" --exit-code 0
