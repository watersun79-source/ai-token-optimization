name: PR31 Site GitHub read gate (isolated)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "experiments/oss-top10-safe-adoption/site_github_connected_read_gate.mjs"
      - "tests/site_github_connected_read_gate.test.mjs"
      - ".github/workflows/pr31-site-github-read-gate.yml"

permissions:
  contents: read

jobs:
  offline-github-read-gate:
    if: >-
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.ref == 'ai/site-github403-failclosed-20261116' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test zero-network read gate (nine new cases)
        run: node --test tests/site_github_connected_read_gate.test.mjs
