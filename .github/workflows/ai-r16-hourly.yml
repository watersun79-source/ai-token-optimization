name: AI R16 hourly offline BOT audit

# Independent from the existing ChatGPT hourly task.
# GitHub's UTC cron runs at minute 15 of every hour, including in Asia/Seoul.
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ai-r16-hourly.yml

# Public repo, standard ubuntu-latest runner. No paid LLMs or remote writes.
permissions:
  contents: read

# A second manual or scheduled invocation must not interrupt an active audit.
concurrency:
  group: ai-r16-hourly-offline-bot-audit
  cancel-in-progress: false

jobs:
  hourly-offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: experiments/r16-bot-runtime
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Fetch CI-verified R16 sources (pinned SHA)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 0631516e491429228e43b2b81cb1960b5b5895f2
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Setup Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Bind current local source inputs to runtime receipt
        run: python measure_runtime.py
      - name: Install offline role wrappers and validate all 100 rules
        run: |
          python install_local.py
          python batch_validate_100.py
      - name: Execute one offline audit cycle
        run: python background_coordinator.py --goal audit --state-dir .hourly_audit_state
      - name: Verify receipt and never claim native ChatGPT automation proof
        run: |
          python -c 'import json; from pathlib import Path; p=Path(".hourly_audit_state/background_latest.json"); d=json.loads(p.read_text()); assert d["status"] == "PASS"; assert d["cycle"] == 1; assert d["kind"] == "OFFLINE_BACKGROUND_LOOP_NOT_NATIVE_RESERVATION"; assert d["official_unattended_app_call_success"] == "UNVERIFIED"; print("R16_HOURLY_OFFLINE_RECEIPT_VALIDATED")'

      - name: Report audit provenance in GitHub summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def read_json(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return {}

          rules = read_json("summary_v6.json")
          audit = read_json(".hourly_audit_state/background_latest.json")
          statuses = rules.get("statuses", {})
          checked_sha = subprocess.run(
              ["git", "rev-parse", "HEAD"], text=True,
              capture_output=True, check=False,
          ).stdout.strip() or "UNVERIFIED"
          event = os.environ.get("GITHUB_EVENT_NAME", "unknown")
          lines = [
              "## AI R16 — 자동 검사 결과",
              "",
              "| 항목 | 검증 결과 |",
              "|---|---|",
              f"| GitHub 실행 ID | `{os.environ.get('GITHUB_RUN_ID', 'unknown')}` |",
              f"| 실행 방식 | `{event}` ({'정기 예약' if event == 'schedule' else '비정기 실행'}) |",
              f"| 워크플로 커밋 | `{os.environ.get('GITHUB_SHA', 'unknown')}` |",
              f"| 검사한 코드 커밋 | `{checked_sha}` |",
              f"| 규칙 100개 | PASS {statuses.get('PASS', '미확인')}, UNVERIFIED {statuses.get('UNVERIFIED', '미확인')} |",
              f"| 오프라인 감사 실행 | `{audit.get('status', '미확인')}` / {audit.get('cycle', '미확인')}회 |",
              "| ChatGPT 원본 예약 앱 호출 증명 | 미검증 (이 작업은 GitHub 오프라인 감사) |",
              "",
              "정기 예약은 매시간 15분으로 등록돼 있지만 실행 시각은 GitHub 사정에 따라 달라질 수 있어.",
              "",
          ]
          report = "\n".join(lines)
          dest = os.environ.get("GITHUB_STEP_SUMMARY")
          if dest:
              with open(dest, "a", encoding="utf-8") as stream:
                  stream.write(report + "\n")
          print("R16_AUDIT_SUMMARY_WRITTEN")
          PY
