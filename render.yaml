services:
  - type: web
    name: ai-bot-mcp-staging
    runtime: python
    repo: https://github.com/watersun79-source/ai-token-optimization.git
    branch: ai/render-free-mcp-staging-2026-10-22
    rootDir: experiments/ai-bot-team
    plan: free
    buildCommand: pip install -r requirements-mcp.txt
    startCommand: python -m uvicorn remote_mcp:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: AI_MCP_BEARER_TOKEN
        sync: false
